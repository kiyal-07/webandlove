<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <meta
      name="description"
      content="24 jours, 24 messages. Un calendrier de l'Avent pour rappeler à quelqu'un qu'il compte."
    />
    <meta property="og:title" content="WEB&LOVE – Calendrier de l'Avent" />
    <meta
      property="og:description"
      content="24 messages à ouvrir, un par jour jusqu'à Noël."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kiyal-07.github.io/webandlove/" />
    <meta
      property="og:image"
      content="https://kiyal-07.github.io/webandlove/image/christmas-wallpaper.jpg"
    />

    <link rel="icon" href="picture/favicon.png" type="image/png" />
    <title>WEB&LOVE</title>
  </head>
  <body>
    <h1>WEB&LOVE</h1>
    <p>
      24 jours pour rappeler à quelqu'un qu'il compte.<br />
      « Parce que les plus beaux cadeaux ne s'emballent pas toujours. »
    </p>

    <p id="compte-a-rebours"></p>
    <div id="calPersonnel">
      <a
        href="https://wa.me/225079947761?text=Bonjour%20!%20Je%20souhaite%20offrir%20un%20calendrier%20WEB%26LOVE%20personnalis%C3%A9. Merci%20de%20me%20contacter%20pour%20les%20modalit%C3%A9s. "
        target="_blank"
        rel="noopener noreferrer"
        >✦ offrez un calendrier personnalisé ✦</a
      >
    </div>
    <button data-theme="amour" class="active">Amour</button>
    <button data-theme="anime">Anime</button>
    <button data-theme="minuit">Minuit 24</button>
    <p><small>Le thème Anime contient de légers spoilers.</small></p>
    <div id="calendrier"></div>
    <div
      id="modal"
      role="dialog"
      aria-modal="true"
      aria-label="Message du calendrier"
    >
      <div class="box">
        <p id="texte-message"></p>
        <button id="fermer">Fermer</button>
      </div>
    </div>
    <p id="messageFinal"></p>
    <script src="script.js"></script>
  </body>
</html>
